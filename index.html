<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конвертер валют</title>
<style>
  :root {
    --bg: #0d0a1f;
    --card: #1a1240;
    --accent: #8b5cf6;
    --accent-light: #c084fc;
    --text: #e0d6f0;
    --text-dim: #a899c0;
    --border: #2d1b4e;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px;
  }

  .container {
    width: 100%; max-width: 480px;
    background: var(--card); border: 1px solid var(--border); border-radius: 24px;
    padding: 32px; box-shadow: 0 12px 30px rgba(139,92,246,0.15);
  }

  h1 {
    margin: 0 0 20px; font-size: 24px; color: var(--accent-light); text-align: center;
  }

  .row {
    display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
  }

  label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }

  select, input {
    width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: 14px;
    background: #16123a; color: var(--text); font-size: 16px; outline: none; transition: 0.2s;
  }
  select:focus, input:focus { border-color: var(--accent); }

  input[type="number"] { text-align: right; }

  .result {
    background: #120a33; border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; text-align: right; min-height: 120px;
  }
  .result-label { font-size: 14px; color: var(--text-dim); margin-bottom: 8px; }
  .result-value { font-size: 32px; font-weight: 700; color: var(--accent-light); line-height: 1.2; }
  .result-meta { font-size: 12px; color: var(--text-dim); margin-top: 8px; }

  .error { color: #d81b60; font-size: 14px; margin-top: 12px; min-height: 24px; }

  @media (max-width: 480px) { .container { padding: 24px; } }
</style>
</head>
<body>

<div class="container">
  <h1>Currency Converter</h1>

  <div class="row">
    <div>
      <label for="from">Из</label>
      <select id="from">
        <option value="USD">USD — Доллар США</option>
        <option value="EUR">EUR — Евро</option>
        <option value="GBP">GBP — Фунт стерлингов</option>
        <option value="CNY">CNY — Юань</option>
        <option value="RUB">RUB — Рубль</option>
      </select>
    </div>
    <div>
      <label for="to">В</label>
      <select id="to">
        <option value="RUB">RUB — Рубль</option>
        <option value="USD">USD — Доллар США</option>
        <option value="EUR">EUR — Евро</option>
        <option value="GBP">GBP — Фунт стерлингов</option>
        <option value="CNY">CNY — Юань</option>
      </select>
    </div>
  </div>

  <div>
    <label for="amount">Сумма</label>
    <input type="number" id="amount" value="1" min="0" step="0.01">
  </div>

  <div class="result">
    <div class="result-label" id="rl">Результат</div>
    <div class="result-value" id="rv">—</div>
    <div class="result-meta" id="rm"></div>
  </div>
  <div class="error" id="err"></div>
</div>

<script>
const rates = {};
let lastDate = '';
let isLoading = true;

async function load() {
  try {
    const res = await fetch('https://www.cbr-xml-daily.ru/daily_json.js');
    const data = await res.json();
    Object.assign(rates, data.Valute);
    lastDate = data.Date;
    isLoading = false;
    update();
  } catch (e) {
    document.getElementById('err').textContent = 'Не удалось загрузить курсы. Проверьте соединение.';
  }
}

function format(n) {
  return n.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function update() {
  const from = document.getElementById('from').value;
  const to = document.getElementById('to').value;
  const amount = parseFloat(document.getElementById('amount').value) || 0;
  const err = document.getElementById('err');

  // 1. Одинаковые валюты — без обращения к API
  if (from === to) {
    document.getElementById('rv').textContent = format(amount);
    document.getElementById('rl').textContent = (to === 'RUB' ? 'В рубли' : `В ${to}`);
    const dateStr = lastDate ? new Date(lastDate).toLocaleDateString('ru-RU') : 'Загрузка…';
    document.getElementById('rm').textContent = 'Дата: ' + dateStr;
    err.textContent = '';
    return;
  }

  // 2. Данные ещё не загружены
  if (!rates[from] || !rates[to]) {
    err.textContent = 'Курсы пока недоступны. Подождите немного.';
    document.getElementById('rv').textContent = '—';
    return;
  }

  const valFrom = rates[from].Value;
  const valTo = rates[to].Value;
  const result = amount * valTo / valFrom;

  document.getElementById('rv').textContent = format(result);
  document.getElementById('rl').textContent = `В ${rates[to].Name}`;
  const dateStr = lastDate ? new Date(lastDate).toLocaleDateString('ru-RU') : '';
  document.getElementById('rm').textContent = dateStr ? 'Дата: ' + dateStr : '';
  err.textContent = '';
}

document.querySelectorAll('select, input').forEach(el => el.addEventListener('change', update));
document.getElementById('amount').addEventListener('input', (e) => {
  if (e.target.value === '') e.target.value = 1;
  update();
});

load();

</script>

</body>
</html>
